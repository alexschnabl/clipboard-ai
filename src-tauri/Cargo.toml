[package]
name = "clipboard-ai-app"
version = "0.1.0"
description = "System-wide AI text assistant: select text anywhere, press a hotkey, get the transformed result pasted back over the selection"
authors = ["Alexander Schnabl <alexander.schnabl@sus-tech.at>"]
license = "MIT"
edition = "2021"
# `smoke` is a second binary (the input-stack diagnostic), so a bare `cargo run`
# -- which is what `tauri dev` issues -- cannot pick one. Name the app explicitly.
default-run = "clipboard-ai-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboard_ai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` enables `Image::from_bytes` for the embedded tray PNG
# (tray_anim.rs); `tray-icon` is the tray itself.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
arboard = "3.6.1"
clipboard-win = "5.4.1"
enigo = "0.6.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
ammonia = "4.2.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
thiserror = "2.0.19"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

